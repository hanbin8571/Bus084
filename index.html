).sort((a,b) => a.t - b.t);

// 인증키는 저장소에 두지 않고 이 기기의 localStorage 에만 저장한다.
const LS_KEY = 'bus084.gbisKey';
const STN = { hauYa:229000976,      // 하우개마을 30881 (야당역·와석초 방면)
              hauUn:229002511,      // 하우개마을 30120 (운정역 방면)
              gagu:229002604,       // 운정가구공단 31452 (084 → 082 환승)
              hanbit:229001506,     // 한빛마을4.8단지 31623 (G7426 강남 방면)
              ya:229002806,         // 야당역
              un:229002362,         // 운정역
              hanbitBack:229001505, // 한빛마을4.8단지 31624 (G7426 귀가 하차)
              gaguBack:229002605 }; // 운정가구공단 31453 (하우개마을 방면, 084 계열 전부 정차)
const RT = {};                      // stationId → { at, list, err }
let rtKey = '';
try { rtKey = localStorage.getItem(LS_KEY) || ''; } catch (e) {}
const esc = v => String(v).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');

async function rtGet(id) {
  const prev = RT[id];
  if (prev && Date.now() - prev.at < 20000) return;
  try {
    const res = await fetch('https://apis.data.go.kr/6410000/busarrivalservice/v2/getBusArrivalListv2'
      + '?format=json&stationId=' + id + '&serviceKey=' + encodeURIComponent(rtKey));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const h = j && j.response && j.response.msgHeader;
    const code = h ? Number(h.resultCode) : -1;
    if (code !== 0 && code !== 4) throw new Error(h ? h.resultMessage : '응답 형식 오류');
    let L = (j.response.msgBody && j.response.msgBody.busArrivalList) || [];
    if (!Array.isArray(L)) L = [L];
    RT[id] = { at: Date.now(), list: L, err: '' };
  } catch (e) {
    RT[id] = { at: Date.now(), list: [], err: String(e && e.message || e).slice(0, 40) };
  }
}
function rtPoll() {
  if (!rtKey || document.hidden) return;
  (S.mode === 'out' ? [STN.hauYa, STN.hauUn, STN.gagu, STN.hanbit]
                    : [STN.ya, STN.un, STN.hanbitBack, STN.gaguBack]).forEach(rtGet);
}
// 실시간 상태 한 줄 (키 없음·조회 실패 등 문제가 있을 때만 화면 맨 위에 표시)
function rtIssue(ids) {
  if (!rtKey) return '실시간 키 없음 — 시간표만으로 표시합니다. 아래 설정에서 키를 저장하십시오.';
  const bad = ids.map(id => RT[id]).find(r => r && r.err);
  if (bad) return '실시간 조회 실패 (' + esc(bad.err) + ') — 시간표만으로 표시합니다.';
  if (ids.some(id => RT[id] && (Date.now() - RT[id].at) / 60000 > 3)) return '실시간 갱신 지연 — 시간표만으로 표시합니다.';
  return '';
}

// 실시간 도착을 절대 시각(분)으로 바꾼 목록. 쓸 수 없는 상태면 null.
function rtTimes(id, names, nowMin) {
  const r = RT[id];
  if (!rtKey || !r || r.err) return null;
  const el = (Date.now() - r.at) / 60000;
  if (el > 3) return null;
  const out = [];
  r.list.filter(x => names.includes(x.routeName)).forEach(x => [1,2].forEach(n => {
    const raw = x['predictTime'+n];
    if (raw === '' || raw == null) return;
    const s = x['predictTimeSec'+n];
    const min = (s === '' || s == null) ? Number(raw) : Number(s) / 60;
    const st = x['remainSeatCnt'+n];
    out.push({ name: x.routeName, t: nowMin + Math.max(0, min - el), loc: x['locationNo'+n],
               seat: (st !== '' && st != null && Number(st) >= 0) ? Number(st) : null });
  }));
  return out.sort((a,b) => a.t - b.t);
}
function nextTrain(stn, plat, dir, we, tol) {
  let all = trainList(stn, dir, we);
  // 00:00~03:00 : 전날 24시대 열차를 당일 새벽으로 환산
  if (plat < 180) all = all.map(x => x >= 1440 ? x - 1440 : x).sort((a,b)=>a-b);
  const list = all.filter(x => x >= plat - (tol || 0));
  if (!list.length) return null;
  const safe = list.find(x => x >= plat);
  return { first: list[0], gap: Math.round(list[0] - plat), safe: safe ?? null,
           after: list.find(x => x > list[0]) ?? null };
}


function paintKey() {
  document.getElementById('keyState').textContent = rtKey ? '· 저장됨' : '· 없음 (실시간 꺼짐)';
}

// ── 현황판 ──────────────────────────────────────────────────────────────
// 줄 하나 = 방법 하나. fin = 그 지점에서 타는 차 시각(들어오는 길은 하우개마을 도착 시각).
const nm = n => n === '084(와석초)' ? '와석초' : n;
const three = ['084','084-1','084(와석초)'];

function render() {
  // 설정 입력란에 포커스가 있는 동안에는 DOM을 갈아치우지 않는다 (값·커서 유실 방지)
  const ae = document.activeElement;
  if (ae && ae.tagName === 'INPUT' && document.getElementById('cfg').contains(ae)) return;

  const now = new Date();
  const nowMin = (now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds())/60;
  const we = isWeekendLike(now);
  const out = S.mode === 'out';
  const t0 = parseHM(S.t) ?? (out ? nowMin + S.walkHau : nowMin);
  // 입력한 시각이 지금과 30분 넘게 떨어져 있으면 실시간은 쓰지 않는다
  const live = (id, names) => Math.abs(t0 - nowMin) <= 30 ? rtTimes(id, names, nowMin) : null;

  // 정류소 승차 시각: 실시간 우선, 없으면 시간표
  const board = (id, names, list, r) => {
    const L = live(id, names);
    const a = L && L.find(x => x.t >= r);
    if (a) return { t:a.t, name:nm(a.name), live:true };
    const p = list && nextIn(list, r);
    return p ? { t:p.t, name:KIND[p.kind], live:false } : null;
  };
  const ride = b => '<b>' + fmt(b.t) + '</b> ' + b.name + ' 승차'
    + '<span class="src' + (b.live ? '' : ' tt') + '">' + (b.live ? '실시간' : '시간표') + '</span>'
    + (b.t >= nowMin - 1 && b.t - nowMin <= 120
        ? ' <span style="color:#8A7A62">' + Math.max(0, Math.ceil(b.t - nowMin)) + '분 후</span>' : '');
  const group = (title, cap, rows) => {
    const ok = rows.filter(r => r.fin != null && !r.rush);
    const best = ok.length ? Math.min(...ok.map(r => r.fin)) : null;
    return '<div class="grp"><div class="lbl"><span>' + title + '</span><i>' + cap + '</i></div>'
      + rows.map(r => '<div class="ln' + (r.fin != null && !r.rush && r.fin === best ? ' best' : '') + '">'
          + '<div class="how">' + r.how + '</div><div class="seq">' + r.seq + '</div>'
          + (r.fin != null ? '<div class="fin' + (r.rush ? ' rush' : '') + '">' + fmt(r.fin) + '</div>'
                           : '<div class="fin na">' + (r.na || '정보 없음') + '</div>')
          + '</div>').join('') + '</div>';
  };
  const none = '<span style="color:#9A8D77">오늘 남은 편 없음</span>';

  document.getElementById('tLabel').textContent = out ? '정류장 도착' : '하차 시각';
  document.getElementById('nowTxt').textContent = S.t ? '' : '현재 ' + fmt(nowMin) + ' 기준';
  let html = '';

  if (out) {
    // ══ 나가는 길 : 하우개마을 정류장 도착 t0 기준 ══════════════════════
    const issue = rtIssue([STN.hauYa, STN.hauUn, STN.gagu, STN.hanbit]);
    if (issue) html += '<div class="bike">' + issue + '</div>';
    const dirTxt = S.dir === 'S' ? '서울 방면' : '문산 방면';
    const tr = (stn, plat, tol) => nextTrain(stn, plat, S.dir, we, tol);
    const trSeq = x => x ? (x.gap < 0 ? ' · <b style="color:#C4452E">서둘러 ' + x.gap + '분</b>, 다음 ' + (x.safe != null ? fmt(x.safe) : '없음')
                                      : ' · 대기 ' + x.gap + '분') : '';

    // ① 야당역 · 경의중앙선
    const b84 = board(STN.hauYa, ['084'], at(UNJEONG, ['base'], () => RIDE.unToHau.base), t0);
    const rows1 = [];
    if (b84) { const arr = b84.t + RIDE.hauToYa.base, x = tr('야당역', arr + PLATFORM, 0);
      rows1.push({ how:'084', seq: ride(b84) + '<br>야당역 ' + fmt(arr) + trSeq(x), fin: x ? x.first : null, na:'열차 없음' });
    } else rows1.push({ how:'084', seq: none, fin:null, na:'—' });
    { const x = tr('야당역', t0 + BIKE.toPlatform, 3);
      rows1.push({ how:'자전거', seq: '<b>' + fmt(t0) + '</b> 출발<br>야당역 ' + fmt(t0 + BIKE.toStation) + trSeq(x),
                   fin: x ? x.first : null, rush: !!(x && x.gap < 0), na:'열차 없음' }); }
    html += group('야당역 · 경의중앙선 ' + dirTxt, '탈 열차', rows1);

    // ② 운정역 · 경의중앙선 (하우개마을→운정역은 084·084-1·와석초가 같은 길)
    const bUn = board(STN.hauUn, three, at(YADANG, ['base'], () => RIDE.yaToHau.base), t0);
    if (bUn) { const arr = bUn.t + RIDE.hauToUn.base, x = tr('운정역', arr + PLATFORM, 0);
      html += group('운정역 · 경의중앙선 ' + dirTxt, '탈 열차',
        [{ how:'084 계열', seq: ride(bUn) + '<br>운정역 ' + fmt(arr) + trSeq(x), fin: x ? x.first : null, na:'열차 없음' }]);
    } else html += group('운정역 · 경의중앙선 ' + dirTxt, '탈 열차', [{ how:'084 계열', seq: none, fin:null, na:'—' }]);

    // ③ 한빛마을4.8단지 · G7426 강남
    const G = live(STN.hanbit, ['G7426']);
    const gFor = arr => (G && arr != null) ? (G.find(g => g.t >= arr + 2) || null) : null;   // 여유 최소 2분
    const gSeq = (arr, g) => '한빛마을 ' + fmt(arr)
      + (g ? ' · 여유 ' + Math.floor(g.t - arr) + '분' + (g.seat != null ? ' · 빈자리 ' + g.seat : '') : '');
    const gNa = G ? '그 뒤 없음' : '정보 없음';
    const rows3 = [];
    const bDir = board(STN.hauYa, ['084-1','084(와석초)'], at(UNJEONG, ['sub','wa'], () => RIDE.unToHau.base), t0);
    if (bDir) { const H = bDir.live ? live(STN.hanbit, ['084-1','084(와석초)']) : null;
      const h = H ? H.find(x => x.t >= bDir.t + 2) : null;
      const arr = h ? h.t : bDir.t + S.rideHan, g = gFor(arr);
      rows3.push({ how:'직행', seq: ride(bDir) + '<br>' + gSeq(arr, g)
        + (we && bDir.name === '와석초' && !bDir.live ? ' · 주말 운행 미확인' : ''), fin: g ? g.t : null, na: gNa });
    } else rows3.push({ how:'직행', seq: none, fin:null, na:'—' });
    // 084 → 082 환승 (운정가구공단). 082는 시간표가 없어 실시간에만 의존.
    let x82 = null, gagu = null;
    if (b84) { gagu = b84.t + S.rideGagu; const R = live(STN.gagu, ['082']); x82 = R ? (R.find(x => x.t >= gagu) || null) : null; }
    if (b84 && x82) { const arr = x82.t + S.ride82, g = gFor(arr);
      rows3.push({ how:'084→082', seq: ride(b84) + '<br>082 ' + fmt(x82.t) + ' · ' + gSeq(arr, g), fin: g ? g.t : null, na: gNa });
    } else rows3.push({ how:'084→082', seq: b84 ? ride(b84) + '<br>운정가구공단 ' + fmt(gagu) + ' · 082 도착 정보 없음' : none, fin:null, na:'—' });
    { const arr = t0 + S.bikeHan, g = gFor(arr);
      rows3.push({ how:'자전거', seq: '<b>' + fmt(t0) + '</b> 출발<br>' + gSeq(arr, g), fin: g ? g.t : null, na: gNa }); }
    html += group('한빛마을4.8단지 · G7426 강남', '탈 G7426', rows3);

    // ④ 운정중앙역 · GTX-A (GTX 시각 데이터 없음 → 역 도착 시각만)
    html += group('운정중앙역 · GTX-A', '역 도착(추정)', [ (b84 && x82)
      ? { how:'084→082', seq: ride(b84) + '<br>082 ' + fmt(x82.t) + ' 환승 · GTX 시각 정보 없음', fin: x82.t + S.ride82Gtx }
      : { how:'084→082', seq: b84 ? ride(b84) + '<br>운정가구공단 ' + fmt(gagu) + ' · 082 도착 정보 없음' : none, fin:null, na:'—' } ]);

  } else {
    // ══ 들어오는 길 : 하차 시각 t0 기준, 오른쪽은 하우개마을 도착 ════════
    const issue = rtIssue([STN.ya, STN.un, STN.hanbitBack, STN.gaguBack]);
    if (issue) html += '<div class="bike">' + issue + '</div>';
    const wait = (b, r) => '<br>대기 ' + Math.max(0, Math.round(b.t - r)) + '분';
    const cap = '하우개마을 도착';

    // ① 야당역 하차
    const rYa = t0 + S.walkYa;
    const bYa = board(STN.ya, ['084'], at(YADANG, ['base'], () => 0), rYa);
    html += group('야당역 하차', cap, [
      bYa ? { how:'084', seq: ride(bYa) + wait(bYa, rYa), fin: bYa.t + RIDE.yaToHau.base }
          : { how:'084', seq: none, fin:null, na:'—' },
      { how:'자전거', seq: '<b>' + fmt(t0) + '</b> 출발', fin: t0 + BIKE.toStation } ]);

    // ② 운정역까지 한 정거장 더 (운정역→하우개마을은 084·084-1·와석초가 같은 길)
    const rUn = t0 + S.train + S.walkUn;
    const bU = board(STN.un, three, at(UNJEONG, ['base','sub','wa'], () => 0), rUn);
    html += group('운정역 하차 · 한 정거장 더', cap, [
      bU ? { how:'084 계열', seq: ride(bU) + wait(bU, rUn)
               + (we && bU.name === '와석초' && !bU.live ? ' · 주말 운행 미확인' : ''), fin: bU.t + RIDE.unToHau.base }
         : { how:'084 계열', seq: none, fin:null, na:'—' } ]);

    // ③ 한빛마을4.8단지 하차 (G7426)
    const toHan = k => k === 'sub' ? S.retSub : S.retWa;
    const bA = board(STN.hanbitBack, ['084-1','084(와석초)'], at(YADANG, ['sub','wa'], toHan), t0);
    const rB = t0 + S.retWalk;
    const bB = board(STN.gaguBack, three,
      at(YADANG, ['base','sub','wa'], k => k === 'base' ? RIDE.yaToHau.base - S.rideGagu : toHan(k) + 1), rB);
    html += group('한빛마을4.8단지 하차 · G7426', cap, [
      bA ? { how:'바로 승차', seq: ride(bA) + wait(bA, t0), fin: bA.t + S.rideHan }
         : { how:'바로 승차', seq: none, fin:null, na:'—' },
      bB ? { how:'한 정류소 걷기', seq: ride(bB) + wait(bB, rB), fin: bB.t + S.rideGagu }
         : { how:'한 정류소 걷기', seq: none, fin:null, na:'—' } ]);
  }
  document.getElementById('cards').innerHTML = html;

  const inp = (k, label) => label + ' <input type="number" data-cfg="' + k + '" value="' + S[k] + '">분';
  document.getElementById('cfg').innerHTML = (out
    ? inp('walkHau', '집 → 정류장 도보') + ' <span style="opacity:.7">(시각 미입력 시)</span><br>'
      + inp('rideHan', '버스 하우개마을 → 한빛마을') + ' · ' + inp('rideGagu', '→ 운정가구공단') + '<br>'
      + inp('ride82', '082 운정가구공단 → 한빛마을') + ' · ' + inp('ride82Gtx', '→ 운정중앙역') + '<br>'
      + inp('bikeHan', '전기자전거 → 한빛마을')
    : inp('walkYa', '야당역 도보') + ' · ' + inp('walkUn', '운정역 도보') + ' · ' + inp('train', '전철 야당↔운정') + '<br>'
      + inp('retWalk', '도보 한빛마을 → 운정가구공단') + '<br>'
      + inp('retSub', '084-1 야당역 출발 → 한빛마을') + ' · ' + inp('retWa', '와석초') + '<br>'
      + inp('rideHan', '버스 한빛마을 → 하우개마을') + ' · ' + inp('rideGagu', '운정가구공단 →'))
    + '<br><span style="opacity:.7">한빛마을·운정가구공단·운정중앙역 관련 값은 추정 기본값입니다. 고치면 이 기기에 저장됩니다.</span>';
}

// ── GPS 보조 판정 ────────────────────────────────────────────────────────
// 기준점 = 집. 폰 재측정 / PC / 최소제곱 추정값 세 좌표의 중심.
// (폰 첫 측정 37.710148, 126.771597 은 19m 이탈로 제외)
const HAUGAE = { lat: 37.709981, lng: 126.771566 };
const RADIUS = 100; // m

function distM(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 +
            Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}


let geoState = 'idle', geoDist = null, geoPos = null, geoAcc = null;
const GEO_TXT = {
  idle:    ['위치 미확인', '#9A8D77'],
  pending: ['위치 확인 중', '#9A8D77'],
  near:    ['집 근처', '#3F7A5E'],
  far:     ['집 근처 아님', '#8A7A62'],
  fail:    ['위치 확인 불가', '#A8452F'],
};
function paintGeo() {
  const el = document.getElementById('geoState');
  const [txt, col] = GEO_TXT[geoState];
  el.textContent = '· ' + txt + (geoDist != null ? ' (' + Math.round(geoDist) + 'm)' : '');
  el.style.color = col;
  document.getElementById('geoRaw').textContent = geoPos
    ? geoPos.lat.toFixed(6) + ', ' + geoPos.lng.toFixed(6) + '  ±' + Math.round(geoAcc) + 'm' : '';
}
// 위치는 버튼을 누를 때만 확인한다(시작할 때 요청하면 iOS 확인창이 매번 뜬다). 표시만 하고 화면은 바꾸지 않는다.
function locate() {
  if (!navigator.geolocation) { geoState = 'fail'; paintGeo(); return; }
  geoState = 'pending'; geoDist = null; paintGeo();
  navigator.geolocation.getCurrentPosition(
    pos => {
      geoPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      geoAcc = pos.coords.accuracy;
      geoDist = distM(HAUGAE, geoPos);
      geoState = geoDist <= RADIUS ? 'near' : 'far';
      paintGeo();
    },
    () => { geoState = 'fail'; geoDist = null; geoPos = null; paintGeo(); },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
  );
}

// ── UI 이벤트 ───────────────────────────────────────────────────────────
const paintMode = () => [...document.getElementById('modeRow').children].forEach(b =>
  b.classList.toggle('on', b.dataset.mode === S.mode));
document.getElementById('modeRow').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.mode = b.dataset.mode;
  try { localStorage.setItem(LS_MODE, S.mode); } catch (err) {}
  paintMode(); render(); rtPoll();
});
document.getElementById('dirRow').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.dir = b.dataset.dir;
  [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('tIn').addEventListener('input', e => { D.t = e.target.value; });
document.getElementById('applyBtn').addEventListener('click', () => { S.t = D.t; render(); });
document.getElementById('nowBtn').addEventListener('click', () => {
  S.t = D.t = ''; document.getElementById('tIn').value = ''; render();
});
document.getElementById('cfg').addEventListener('input', e => {
  const k = e.target.dataset.cfg; if (!k) return;
  S[k] = Number(e.target.value) || 0;
  try { localStorage.setItem(LS_CFG, JSON.stringify(Object.fromEntries(CFG_KEYS.map(c => [c, S[c]])))); } catch (err) {}
  document.getElementById('cards').innerHTML = '';   // 다음 초에 재계산
});
document.getElementById('cfg').addEventListener('change', () => render());
document.getElementById('geoBtn').addEventListener('click', locate);

// ── 실시간 키 저장·삭제 ─────────────────────────────────────────────────
document.getElementById('keySave').addEventListener('click', () => {
  const v = document.getElementById('keyIn').value.trim(); if (!v) return;
  rtKey = v;
  try { localStorage.setItem(LS_KEY, v); } catch (e) {}
  document.getElementById('keyIn').value = '';
  Object.keys(RT).forEach(k => delete RT[k]);
  paintKey(); render(); rtPoll();
});
document.getElementById('keyDel').addEventListener('click', () => {
  rtKey = '';
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  Object.keys(RT).forEach(k => delete RT[k]);
  paintKey(); render();
});
document.addEventListener('visibilitychange', rtPoll);

paintMode(); paintKey(); paintGeo();
render();
setInterval(render, 1000);
rtPoll();
setInterval(rtPoll, 45000);   // 정류소 4곳 × 45초. 하루 1000회 한도 안에서 약 3시간 화면 사용분
</script>
</body>
</html>
