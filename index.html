<!DOCTYPE html>
<html lang="ko">
<head>

<title>084 하우개마을</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #F6F2EA; color: #17130E;

  084-1·와석초·심야 편은 제외. 버스 소요시간은 실측 기준(야당 7분 / 운정 8분).<br>

// ── 경의중앙선 (2025.5.1 시행, 파주위키) M=문산 방면 S=서울·용문 방면 ─────
const TRAIN = {
 '야당역':{
  M:{wd:{6:[9,27,38,48],7:[5,16,22,42,47,58],8:[8,16,24,28,33,39,47,51,56],9:[5,14,18,22,42,47,52],10:[0,7,12,22,27,32,48,53],11:[6,20,34,51],12:[5,15,23,42,54],13:[9,18,31,42],14:[3,16,40,52],15:[1,6,28,42,50],16:[1,8,36,47,55],17:[4,14,32,42,46,52],18:[11,20,26,41,51,56],19:[4,13,21,30,39,43,48,57],20:[3,8,15,28,40,46],21:[1,18,23,30,44,52,58],22:[12,25,48,59],23:[11,35,46],24:[5,21]},
     we:{6:[18,48,59],7:[13,27,36,48],8:[1,27,41,56],9:[10,30,43,55],10:[8,14,23,30,38,49],11:[6,20,37,51],12:[14,25,40,54],13:[8,27,41,58],14:[5,23,46,55],15:[8,28,39,58],16:[6,20,36,49],17:[8,32,44,56],18:[17,39,49],19:[7,21,31,45,54],20:[15,24,30,43,51],21:[3,23,38,49,58],22:[13,36,44,51],23:[7,20,47],24:[13,22]}},
  S:{wd:{5:[20,26,43,54],6:[3,13,24,30,35,39,46,50,55],7:[2,6,15,21,28,32,38,49,56],8:[9,15,27,32,39,48],9:[0,13,27,43,51,59],10:[19,34,43],11:[2,23,32,42,49],12:[5,20,29,39,59],13:[15,22,33,44],14:[1,6,22,45,58],15:[6,18,30,44,58],16:[8,16,33,39,43,50,59],17:[8,16,30,43,51,59],18:[6,13,19,25,36,41,49,57],19:[5,24,34,40,54],20:[6,15,24,43,55],21:[6,20,26,40,51],22:[16,23,32,58],23:[9,21]},
     we:{5:[36,56],6:[14,29,46,54],7:[2,11,35,48],8:[0,11,20,28,42,53],9:[7,18,30,45,59],10:[11,21,31,43,56],11:[16,31,44,58],12:[13,28,42],13:[0,13,33,46],14:[1,13,31,38,54],15:[12,35,46],16:[2,16,31,44,59],17:[13,26,38,46],18:[3,22,29,47,56],19:[25,38,53],20:[4,19,35,43],21:[3,12,34,53],22:[13,26,38,50],23:[8,33]}}},
 '운정역':{
  M:{wd:{6:[11,30,40,50],7:[7,18,24,44,49],8:[0,10,18,26,31,36,41,49,53,59],9:[7,16,21,25,44,50,54],10:[3,10,14,24,30,34,50,55],11:[8,22,37,53],12:[7,17,25,44,56],13:[11,20,33,44],14:[5,18,42,54],15:[3,8,30,44,52],16:[3,10,38,49,57],17:[6,16,34,44,49,54],18:[13,23,29,43,53,58],19:[6,15,23,32,41,45,50,59],20:[5,10,17,30,42,48],21:[3,21,25,32,46,54],22:[0,14,27,51],23:[1,13,37,48],24:[7,24]},
     we:{6:[21,50],7:[1,15,29,39,50],8:[3,29,43,58],9:[12,32,45,57],10:[10,17,25,32,40,51],11:[8,22,39,53],12:[16,27,42,56],13:[10,29,43],14:[0,7,25,48,57],15:[10,30,41],16:[0,8,22,38,51],17:[10,34,46,58],18:[19,41,51],19:[9,23,33,47,56],20:[17,26,32,45,53],21:[5,25,40,52],22:[0,15,38,47,53],23:[9,22,49],24:[15,25]}},
  S:{wd:{5:[18,24,41,52],6:[1,11,22,28,33,37,44,48,53],7:[0,4,13,19,26,30,36,47,54],8:[7,13,25,30,37,46,58],9:[11,25,41,49,57],10:[17,32,41],11:[0,21,30,40,47],12:[3,18,27,37,57],13:[13,20,31,42,59],14:[4,20,43,56],15:[4,16,28,42,56],16:[6,14,31,37,41,48,57],17:[6,14,28,41,49,57],18:[4,11,17,23,34,39,47,55],19:[3,22,32,38,52],20:[4,13,22,41,53],21:[4,18,24,38,49],22:[14,21,30,56],23:[7,19]},
     we:{5:[34,54],6:[12,27,44,52],7:[0,9,33,46,58],8:[9,18,26,40,51],9:[5,16,28,43,57],10:[9,19,29,41,54],11:[14,29,42,56],12:[11,26,40,58],13:[11,31,44,59],14:[11,29,36,52],15:[10,33,44],16:[0,14,29,42,57],17:[11,24,36,44],18:[1,20,27,45,54],19:[23,36,51],20:[2,17,33,41],21:[1,10,32,51],22:[11,24,36,48],23:[6,31]}}},
};

// 084 단일 편성 기준 (사용자 실측). 084-1은 우회가 커서 선택지에서 제외.
const RIDE = {
  yaToHau:{base:7},   // 야당역 출발 → 하우개마을
  unToHau:{base:8},   // 운정역 출발 → 하우개마을
  hauToYa:{base:7},   // 하우개마을 승차(운정역발) → 야당역
  hauToUn:{base:8},   // 하우개마을 승차(야당역발) → 운정역
};
const PLATFORM = 2;
const BIKE = { toStation: 7, toPlatform: 8 };  // 하우개마을 → 야당역 / → 플랫폼

const flat = t => Object.keys(t).flatMap(h =>
  t[h].filter(([,k]) => k==='base').map(([m,k]) => ({dep:+h*60+m, kind:k}))
).sort((a,b)=>a.dep-b.dep);
const F_UN = flat(UNJEONG), F_YA = flat(YADANG);

const fmt = t => { const r = Math.round(t);
  return String(Math.floor(r/60)%24).padStart(2,'0')+':'+String(r%60).padStart(2,'0'); };
const parseHM = v => { if(!/^\d{1,2}:\d{2}$/.test(v||'')) return null;
  const [h,m]=v.split(':').map(Number); return h>24||m>59?null:h*60+m; };
const trainList = (stn,dir,we) => { const t=(TRAIN[stn]||{})[dir]||{};
  const tt=t[we?'we':'wd']||{};
  return Object.keys(tt).flatMap(h=>tt[h].map(m=>+h*60+m)).sort((a,b)=>a-b); };

// 공휴일은 열차 주말 시간표를 적용. 음력 명절은 매년 갱신 필요.
const HOLIDAYS = new Set([
  '2026-08-17',                              // 광복절 대체
  '2026-09-24','2026-09-25','2026-09-28',    // 추석 연휴 (28일 대체 여부 미확정)
  '2026-10-05','2026-10-09',                 // 개천절 대체 / 한글날
  '2026-12-25',
  '2027-01-01','2027-03-01','2027-05-05','2027-06-07',
  '2027-08-15','2027-10-03','2027-10-09','2027-12-25',
]);
const isWeekendLike = d => {
  const day = d.getDay();
  if (day === 0 || day === 6) return true;
  const k = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
          + '-' + String(d.getDate()).padStart(2,'0');
  return HOLIDAYS.has(k);
};

// ── 상태 ────────────────────────────────────────────────────────────────
const S = { mode: 'home',
            dir:'S', t:'', ovYa:'', ovUn:'', ovHau:'',
            walkYa:2, walkUn:2, walkHau:3, train:2 };
const D = { t:'', ovYa:'', ovUn:'', ovHau:'' };   // 미적용 입력값

// 00:00~03:00 사이에는 전날 24시대 편성도 유효하다
const pick = (list, r, off) => {
  const key = d => d.dep + (off ? off(d) : 0);
  if (r < 180) {
    const late = list.find(d => key(d) >= r + 1440);
    if (late) return { ...late, dep: late.dep - 1440 };
  }
  return list.find(d => key(d) >= r) || null;
};

function plans(nowMin, we) {
  const t0 = parseHM(S.t) ?? nowMin;
  const out = [];
  if (S.mode === 'home') {
    const rYa = parseHM(S.ovYa) ?? t0 + S.walkYa;
    const rUn = parseHM(S.ovUn) ?? t0 + S.train + S.walkUn;
    const a = pick(F_YA, rYa);
    const b = pick(F_UN, rUn);
    if (a) out.push({key:'야당역에서 하차', ovKey:'ovYa', board:a.dep, kind:a.kind,
      ready:rYa, wait:a.dep-rYa, arrive:a.dep+RIDE.yaToHau[a.kind], dest:'하우개마을'});
    if (b) out.push({key:'운정역까지 한 정거장 더', ovKey:'ovUn', board:b.dep, kind:b.kind,
      ready:rUn, wait:b.dep-rUn, arrive:b.dep+RIDE.unToHau[b.kind], dest:'하우개마을'});
  } else {
    const rH = parseHM(S.ovHau) ?? t0 + S.walkHau;
    const a = pick(F_UN, rH, d => RIDE.unToHau[d.kind]);
    const b = pick(F_YA, rH, d => RIDE.yaToHau[d.kind]);
    if (a) { const bd=a.dep+RIDE.unToHau[a.kind];
      out.push({key:'야당역 방면', ovKey:'ovHau', stn:'야당역', board:bd, kind:a.kind,
        ready:rH, wait:bd-rH, arrive:bd+RIDE.hauToYa[a.kind], dest:'야당역'}); }
    if (b) { const bd=b.dep+RIDE.yaToHau[b.kind];
      out.push({key:'운정역 방면', ovKey:'ovHau', stn:'운정역', board:bd, kind:b.kind,
        ready:rH, wait:bd-rH, arrive:bd+RIDE.hauToUn[b.kind], dest:'운정역'}); }
  }
  out.forEach(p => p.wait = Math.max(0, Math.round(p.wait)));
  return out;
}

function nextTrain(stn, plat, dir, we, tol) {
  let all = trainList(stn, dir, we);
  // 00:00~03:00 : 전날 24시대 열차를 당일 새벽으로 환산
  if (plat < 180) all = all.map(x => x >= 1440 ? x - 1440 : x).sort((a,b)=>a-b);
  const list = all.filter(x => x >= plat - (tol || 0));
  if (!list.length) return null;
  const safe = list.find(x => x >= plat);
  return { first: list[0], gap: Math.round(list[0] - plat), safe: safe ?? null,
           after: list.find(x => x > list[0]) ?? null };
}

function trainHtml(tr) {
  if (!tr) return '해당 방면 운행 종료';
  const rush = tr.gap < 0;
  return (rush
      ? '<b style="color:#C4452E">' + fmt(tr.first) + ' 열차 (서둘러 ' + tr.gap + '분)</b>'
      : '<b>' + fmt(tr.first) + ' 열차</b> (대기 ' + tr.gap + '분)')
    + (tr.after ? ', 다음 ' + fmt(tr.after) : '');
}

function render() {
  // 입력란에 포커스가 있는 동안에는 DOM을 갈아치우지 않는다 (값·커서 유실 방지)
  const ae = document.activeElement;
  if (ae && ae.tagName === 'INPUT'
      && (document.getElementById('cards').contains(ae)
       || document.getElementById('cfg').contains(ae))) return;

  const now = new Date();
  const nowMin = (now.getHours()*3600 + now.getMinutes()*60 + now.getSeconds())/60;
  const we = isWeekendLike(now);

  document.getElementById('tLabel').textContent =
    S.mode==='home' ? '야당역 하차' : '정류장 도착';
  document.getElementById('dirRow').style.display = S.mode==='out' ? 'flex' : 'none';
  document.getElementById('nowTxt').textContent = S.t ? '' : '현재 '+fmt(nowMin)+' 기준';

  const P = plans(nowMin, we);
  let html = '';

  if (S.mode === 'out') {
    // ── 하우개마을 → 역 : 버스 2안 + 전기자전거를 열차 시각으로 비교 ──────
    const t0 = P.length ? P[0].ready
             : (parseHM(S.ovHau) ?? (parseHM(S.t) ?? nowMin) + S.walkHau);
    const cand = P.map(p => ({
      ...p, plat: p.arrive + PLATFORM,
      tr: nextTrain(p.stn, p.arrive + PLATFORM, S.dir, we, 0),
    }));
    const bikePlat = t0 + BIKE.toPlatform;
    cand.push({ bike:true, key:'전기자전거', stn:'야당역', ready:t0,
      board:t0, arrive:t0 + BIKE.toStation, plat:bikePlat, wait:0,
      tr: nextTrain('야당역', bikePlat, S.dir, we, 3) });

    // 추천 = 실제로 탈 수 있는 열차가 가장 이른 쪽 (서둘러 편은 제외)
    const rank = c => (c.tr && c.tr.safe != null) ? c.tr.safe : 1e9;
    const bestT = Math.min(...cand.map(rank));

    cand.forEach(c => {
      const win = rank(c) === bestT && bestT < 1e9;
      html += '<div class="card'+(win?' win':'')+'">'
        + '<div class="lbl">'+c.key+(win?'  ← 열차 최속':'')+'</div>';
      if (c.bike) {
        const bl = Math.max(0, Math.ceil(c.board - nowMin));
        html += '<div class="big">'+fmt(c.board)+'<span>출발 · 대기 없음</span></div>'
          + '<div class="sub">지금부터 '+bl+'분 후 · 내 도착 '+fmt(c.ready)
          + ' 기준 · 야당역 '+fmt(c.arrive)+'</div>';
      } else {
        const left = Math.max(0, Math.ceil(c.board - nowMin));
        html += '<div class="big">'+fmt(c.board)+'<span>'+(c.kind==='sub'?'084-1':'084')+' 출발</span></div>'
          + '<div class="sub">지금부터 '+left+'분 후 · 내 도착 '+fmt(c.ready)
          + ' 기준 <b>대기 '+c.wait+'분</b></div>'
          + '<div class="ov"><span>정류장 도착</span>'
          + '<input type="time" lang="en-GB" data-ov="'+c.ovKey+'" value="'+(D[c.ovKey]||'')+'" style="width:98px">'
          + (S[c.ovKey] ? '<button class="sm" data-clr="'+c.ovKey+'" style="padding:2px 7px;font-size:11px">자동</button>'
                        : '<span>('+fmt(c.ready)+' 자동)</span>')
          + '<span>· '+c.dest+' '+fmt(c.arrive)+'</span></div>';
      }
      html += '<div class="trn">플랫폼 '+fmt(c.plat)+' → '+trainHtml(c.tr)+'</div></div>';
    });
    if (!P.length) html += '<div style="color:#6A5E4C;font-size:13px">버스 운행 종료</div>';

  } else {
    // ── 역 → 하우개마을 : 대기시간 최소 ────────────────────────────────
    const best = P.length ? P.reduce((x,y)=> y.wait<x.wait?y:x) : null;
    const bike = P.length > 0 && P.every(p=>p.wait>5);
    if (bike) html += '<div class="bike">양쪽 모두 5분 초과 대기. '
      + '야당역에서 전기자전거를 타십시오.</div>';
    if (!P.length) html += '<div style="color:#6A5E4C;font-size:14px">해당 시각 이후 운행 없음</div>';

    P.forEach(p => {
      const win = !bike && best && p.wait===best.wait;
      const left = Math.max(0, Math.ceil(p.board - nowMin));
      html += '<div class="card'+(win?' win':'')+'">'
        + '<div class="lbl">'+p.key+(win?'  ← 대기 최소':'')+'</div>'
        + '<div class="big">'+fmt(p.board)+'<span>'+(p.kind==='sub'?'084-1':'084')+' 출발</span></div>'
        + '<div class="sub">지금부터 '+left+'분 후 · 내 도착 '+fmt(p.ready)
        + ' 기준 <b>대기 '+p.wait+'분</b></div>'
        + '<div class="ov"><span>정류장 도착</span>'
        + '<input type="time" lang="en-GB" data-ov="'+p.ovKey+'" value="'+(D[p.ovKey]||'')+'" style="width:98px">'
        + (S[p.ovKey] ? '<button class="sm" data-clr="'+p.ovKey+'" style="padding:2px 7px;font-size:11px">자동</button>'
                      : '<span>('+fmt(p.ready)+' 자동)</span>')
        + '<span>· '+p.dest+' '+fmt(p.arrive)+'</span></div></div>';
    });
  }

  document.getElementById('cards').innerHTML = html;

  const cfg = S.mode==='home'
    ? '야당역 도보 <input type="number" data-cfg="walkYa" value="'+S.walkYa+'">분 · '
      + '운정역 도보 <input type="number" data-cfg="walkUn" value="'+S.walkUn+'">분 · '
      + '전철 야당↔운정 <input type="number" data-cfg="train" value="'+S.train+'">분'
    : '하우개마을 도보 <input type="number" data-cfg="walkHau" value="'+S.walkHau+'">분';
  document.getElementById('cfg').innerHTML = cfg;
}

// ── GPS 보조 판정 ────────────────────────────────────────────────────────
// 기준점 = 집. 폰 재측정 / PC / 최소제곱 추정값 세 좌표의 중심.
// (폰 첫 측정 37.710148, 126.771597 은 19m 이탈로 제외)
const HAUGAE = { lat: 37.709981, lng: 126.771566 };
const RADIUS = 100; // m

function distM(a, b) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 +
            Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function setMode(m) {
  S.mode = m;
  [...document.getElementById('modeRow').children].forEach(b =>
    b.classList.toggle('on', b.dataset.mode === m));
  render();
}

let geoState = 'pending', geoDist = null, geoPos = null, geoAcc = null;
const GEO_TXT = {
  pending: ['위치 확인 중', '#9A8D77'],
  near:    ['집 근처', '#3F7A5E'],
  far:     ['집 근처 아님', '#8A7A62'],
  fail:    ['위치 확인 불가', '#A8452F'],
};
function paintGeo() {
  const el = document.getElementById('geoState');
  const [txt, col] = GEO_TXT[geoState];
  el.textContent = '· ' + txt + (geoDist != null ? ' (' + Math.round(geoDist) + 'm)' : '');
  el.style.color = col;
  const raw = document.getElementById('geoRaw');
  raw.textContent = geoPos
    ? geoPos.lat.toFixed(6) + ', ' + geoPos.lng.toFixed(6) + '  ±' + Math.round(geoAcc) + 'm'
    : '';
}

let geoDone = false;

function locate(first) {
  if (!navigator.geolocation) { geoState = 'fail'; paintGeo(); return; }
  geoState = 'pending'; geoDist = null; paintGeo();
  navigator.geolocation.getCurrentPosition(
    pos => {
      geoPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      geoAcc = pos.coords.accuracy;
      geoDist = distM(HAUGAE, geoPos);
      geoState = geoDist <= RADIUS ? 'near' : 'far';
      paintGeo();
      const target = geoState === 'near' ? 'out' : 'home';
      if (first && !geoDone) { geoDone = true; if (target !== S.mode) setMode(target); }
    },
    () => { geoState = 'fail'; geoDist = null; geoPos = null; paintGeo(); },  // 거부·실패 시 시각 기준 유지
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
  );
}
// ── UI 이벤트 ───────────────────────────────────────────────────────────
document.getElementById('modeRow').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.mode = b.dataset.mode;
  [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('dirRow').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.dir = b.dataset.dir;
  [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
  render();
});
document.getElementById('tIn').addEventListener('input', e => { D.t = e.target.value; });
document.getElementById('applyBtn').addEventListener('click', () => {
  S.t = D.t; S.ovYa = D.ovYa; S.ovUn = D.ovUn; S.ovHau = D.ovHau; render();
});
document.getElementById('nowBtn').addEventListener('click', () => {
  S.t = S.ovYa = S.ovUn = S.ovHau = '';
  D.t = D.ovYa = D.ovUn = D.ovHau = '';
  document.getElementById('tIn').value = ''; render();
});
document.getElementById('cards').addEventListener('input', e => {
  if (e.target.dataset.ov) D[e.target.dataset.ov] = e.target.value;
});
document.getElementById('cards').addEventListener('click', e => {
  const b = e.target.closest('[data-clr]'); if (!b) return;
  S[b.dataset.clr] = ''; D[b.dataset.clr] = ''; render();
});
document.getElementById('cfg').addEventListener('input', e => {
  const k = e.target.dataset.cfg; if (!k) return;
  S[k] = Number(e.target.value) || 0;
  document.getElementById('cards').innerHTML = '';   // 다음 초에 재계산
});
document.getElementById('cfg').addEventListener('change', () => render());

document.getElementById('geoState').addEventListener('click', () => locate(false));
document.getElementById('geoBtn').addEventListener('click', () => locate(false));
locate(true);

// 시작 시 기본 방향(역→하우개마을) 버튼 상태 반영. GPS 확인되면 즉시 교체.
[...document.getElementById('modeRow').children].forEach(b =>
  b.classList.toggle('on', b.dataset.mode === S.mode));

render();
setInterval(render, 1000);
</script>
